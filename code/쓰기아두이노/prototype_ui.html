<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>웨이퍼 결함 맵</title>
<style>
  body{font-family:sans-serif; text-align:center; background:#f5f5f5;}
  h2{margin-top:30px;}
  #grid{display:grid; grid-template-columns:repeat(8,50px); grid-template-rows:repeat(8,50px);
        gap:4px; justify-content:center; margin:20px auto;}
  .cell{width:50px;height:50px;background:#fff;border:1px solid #999;cursor:pointer;
        box-sizing:border-box;}
  .cell.defect{background:#e74c3c;}
  .cell:hover{outline:2px solid #3498db;}
  .cell.disabled{background:transparent;border-color:transparent;cursor:default;}
  button{padding:10px 20px;margin:5px;font-size:15px;cursor:pointer;}
  #status{margin-top:10px;font-weight:bold;color:#333;}
  pre{text-align:left; display:inline-block; background:#eee; padding:10px; font-size:12px;}
  .row{display:flex; justify-content:center; gap:40px; flex-wrap:wrap;}
</style>
</head>
<body>
<h2>웨이퍼 결함 맵</h2>
<p>칸을 클릭해 결함(빨강)을 입력하고 전송하면, 아두이노가 저장 후 즉시 스캔한 결과를 보여줍니다.</p>
<div id="grid"></div>
<div>
  <button id="btnSend">전송 (저장 + 스캔)</button>
  <button id="btnReset">초기화</button>
</div>
<div id="status">대기 중</div>

<div class="row">
  <div>
    <p>보낸 배열</p>
    <pre id="sentOutput">[]</pre>
  </div>
  <div>
    <p>아두이노가 실제로 스캔한 배열</p>
    <pre id="scannedOutput">[]</pre>
  </div>
</div>

<script>
const ROWS = 8, COLS = 8;
let defectArray = Array.from({length: ROWS}, () => Array(COLS).fill(0));

// 4개 모서리를 3칸씩 잘라내어 둥근 웨이퍼 형태로 보이게 함 (총 12칸 비활성화)
const disabledCells = new Set([
  '0,0','0,1','1,0',       // 좌상단
  '0,6','0,7','1,7',       // 우상단
  '6,0','7,0','7,1',       // 좌하단
  '7,6','7,7','6,7'        // 우하단
]);

const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const sentOutput = document.getElementById('sentOutput');
const scannedOutput = document.getElementById('scannedOutput');

for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const cell = document.createElement('div');
    const isDisabled = disabledCells.has(`${r},${c}`);
    cell.className = isDisabled ? 'cell disabled' : 'cell';
    if (!isDisabled) {
      cell.addEventListener('click', () => {
        defectArray[r][c] = defectArray[r][c] ? 0 : 1;
        cell.classList.toggle('defect');
        sendCurrentArray(); // 클릭할 때마다 즉시 반영
      });
    }
    grid.appendChild(cell);
  }
}

document.getElementById('btnReset').addEventListener('click', () => {
  defectArray = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('defect'));
  sentOutput.textContent = '[]';
  scannedOutput.textContent = '[]';
  sendCurrentArray(); // 초기화도 즉시 반영
});

document.getElementById('btnSend').addEventListener('click', sendCurrentArray);

async function sendCurrentArray() {
  statusEl.textContent = '전송 중... (595 저장 + 4067 스캔 대기)';
  const flat = defectArray.flat();
  sentOutput.textContent = JSON.stringify(defectArray);

  try {
    const res = await fetch('/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({array: flat})
    });
    const data = await res.json();
    if (data.error) {
      statusEl.textContent = '오류: ' + data.error;
      return;
    }
    scannedOutput.textContent = JSON.stringify(data.scanned);
    statusEl.textContent = '완료: 보낸 배열과 스캔된 배열이 일치하는지 확인하세요.';
  } catch (e) {
    statusEl.textContent = '서버 통신 실패: ' + e;
  }
}
</script>
</body>
</html>
